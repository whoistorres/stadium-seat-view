<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <title>Stadium Seat View</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 class="brand">Stadium Seat View</h1>
        <div id="hud" class="hud"></div>
      </header>

      <main class="stage">
        <div id="viewport" class="viewport"></div>
        <div id="stage-overlay" class="stage-overlay"></div>
        <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
      </main>

      <aside id="panel" class="panel" aria-label="Seat picker and ticket details"></aside>

      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-text">Building stadium…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
